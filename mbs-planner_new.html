<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBS Daily Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy:   #1B3461;
  --navy2:  #243f78;
  --blue:   #2563EB;
  --bg:     #EEF1F7;
  --card:   #FFFFFF;
  --border: #DDE3F0;
  --text:   #1A2B4A;
  --muted:  #7A8BA6;
  --faint:  #F4F6FB;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 13px;
}

/* ── TOP NAV ── */
.top-bar {
  background: var(--navy);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  border-bottom: 3px solid var(--blue);
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar-left { display: flex; align-items: center; gap: 14px; }
.mbs-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 20px; color: #fff; letter-spacing: -0.5px; }
.mbs-logo span { color: #60A5FA; }
.top-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.2); }
.top-subtitle { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.4); }
.top-bar-right { display: flex; align-items: center; gap: 16px; }
.top-date { font-size: 11px; color: rgba(255,255,255,0.45); text-align: right; line-height: 1.55; }
.top-date strong { display: block; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.88); }
.new-week-btn {
  font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15); padding: 5px 13px;
  border-radius: 4px; cursor: pointer; transition: all .15s;
}
.new-week-btn:hover { background: rgba(220,38,38,0.2); border-color: rgba(220,38,38,0.4); color: #fca5a5; }

.nav-btn {
  font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15); padding: 5px 12px;
  border-radius: 4px; cursor: pointer; transition: all .15s; white-space: nowrap;
}
.nav-btn:hover { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
.nav-btn.save-file { background: rgba(5,150,105,0.25); border-color: rgba(52,211,153,0.4); color: #6EE7B7; }
.nav-btn.save-file:hover { background: rgba(5,150,105,0.5); border-color: #34D399; color: #fff; }

/* ── FRIDAY SAVE REMINDER ── */
.friday-banner {
  background: #F0FDF4; border: 1px solid #86EFAC;
  border-left: 3px solid #16A34A; border-radius: 6px;
  padding: 10px 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
}
.friday-banner-text { flex: 1; font-size: 12px; color: #15803D; font-weight: 500; }
.friday-banner-text strong { font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.5px; }
.friday-save-btn {
  background: #16A34A; color: white; border: none;
  padding: 6px 14px; border-radius: 4px; font-family: 'Montserrat', sans-serif;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
  transition: background .15s; white-space: nowrap;
}
.friday-save-btn:hover { background: #15803D; }
.friday-dismiss { background: transparent; border: none; color: #16A34A; cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }

/* ── DAY TABS ── */
.day-tabs {
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  position: sticky;
  top: 52px;
  z-index: 99;
  box-shadow: 0 1px 4px rgba(27,52,97,0.06);
}
.day-tab {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); padding: 13px 15px 11px;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; user-select: none; white-space: nowrap;
}
.day-tab:hover { color: var(--navy); }
.day-tab.active { color: var(--navy); border-bottom-color: var(--blue); }
.day-tab .today-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); margin-left: 5px; vertical-align: middle; margin-top: -2px; }
.tab-sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
.brain-tab {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); padding: 13px 15px 11px;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; user-select: none;
}
.brain-tab:hover { color: var(--navy); }
.brain-tab.active { color: #92400E; border-bottom-color: #F59E0B; }

.week-tab {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); padding: 13px 15px 11px;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; user-select: none; white-space: nowrap;
}
.week-tab:hover { color: var(--navy); }
.week-tab.active-tw { color: #065F46; border-bottom-color: #059669; }
.week-tab.active-nw { color: #1E40AF; border-bottom-color: #3B82F6; }
.week-tab.active-lw { color: #1e3a5f; border-bottom-color: #64748B; }

/* ── WEEKLY BOARD ── */
.weekly-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.weekly-title { font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 800; color: var(--navy); }
.weekly-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.weekly-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.carry-all-btn {
  font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 600;
  background: #ECFDF5; color: #065F46; border: 1px solid #6EE7B7;
  padding: 6px 14px; border-radius: 4px; cursor: pointer; transition: all .15s;
}
.carry-all-btn:hover { background: #059669; color: #fff; border-color: #059669; }
.lw-badge {
  display: inline-block; font-family: 'Montserrat', sans-serif;
  font-size: 8.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  background: #F1F5F9; color: #64748B; border: 1px solid var(--border);
  padding: 2px 7px; border-radius: 3px; margin-left: 8px;
}

/* ── CONTENT WRAPPER ── */
.content { max-width: 960px; margin: 0 auto; padding: 20px 20px 60px; }

/* ── CARRY-OVER BANNER ── */
.co-banner {
  background: #FFFBEB; border: 1px solid #FDE68A;
  border-left: 3px solid #F59E0B; border-radius: 6px;
  margin-bottom: 16px; overflow: hidden;
}
.co-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; user-select: none;
}
.co-title {
  font-family: 'Montserrat', sans-serif; font-size: 9.5px;
  font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: #92400E; flex: 1;
}
.co-dismiss {
  background: transparent; border: none; color: #B45309;
  font-size: 16px; line-height: 1; cursor: pointer; padding: 0 4px;
}
.co-body { padding: 2px 14px 10px; }
.co-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid #FDE68A; font-size: 11.5px;
}
.co-item:last-child { border-bottom: none; }
.co-meta {
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; color: #B45309; flex-shrink: 0;
  min-width: 90px; padding-top: 2px;
}
.co-text { flex: 1; line-height: 1.4; color: #78350F; }
.co-add {
  background: transparent; border: 1px solid #F59E0B;
  color: #92400E; font-size: 10px; font-weight: 600;
  padding: 2px 9px; border-radius: 3px; cursor: pointer;
  font-family: 'Inter', sans-serif; transition: all .12s; white-space: nowrap;
}
.co-add:hover { background: #F59E0B; color: #fff; }

/* ── MAIN DAILY GRID ── */
.daily-grid { display: grid; grid-template-columns: 1fr 285px; gap: 14px; margin-bottom: 14px; }
.daily-left { display: flex; flex-direction: column; gap: 14px; }
.daily-right { display: flex; flex-direction: column; gap: 14px; }
.full-row { margin-bottom: 14px; }

/* ── CARDS ── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; display: flex;
  flex-direction: column; box-shadow: 0 1px 4px rgba(27,52,97,0.06);
}
.card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 10px 13px; border-bottom: 1px solid var(--border);
  border-left: 3px solid var(--c, #475569); background: var(--faint);
}
.card-head .lbl {
  font-family: 'Montserrat', sans-serif; font-size: 9px;
  font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--c, #475569); flex: 1;
}
.cnt-badge {
  font-size: 10px; font-weight: 600; color: var(--muted);
  background: var(--border); padding: 1px 7px;
  border-radius: 99px; min-width: 22px; text-align: center;
}
.max-badge {
  font-size: 10px; font-weight: 700; color: #DC2626;
  background: #FEE2E2; padding: 1px 7px; border-radius: 99px;
}
.max-hit {
  padding: 6px 10px; background: #FEF2F2;
  border-top: 1px solid #FECACA; font-size: 10.5px;
  color: #DC2626; font-weight: 500; text-align: center;
}

/* ── ITEMS LIST ── */
.items {
  list-style: none; overflow-y: auto;
  min-height: 64px; max-height: 220px;
  padding: 3px 0; flex: 1;
}
.items::-webkit-scrollbar { width: 3px; }
.items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.it {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 10px; transition: background .1s;
}
.it:hover { background: #F7F9FD; }
.it-cb {
  flex-shrink: 0; width: 15px; height: 15px;
  border: 1.5px solid var(--border); border-radius: 3px;
  cursor: pointer; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s; background: transparent;
}
.it-cb:hover { border-color: var(--c, #2563EB); }
.it.checked .it-cb { background: var(--c, #2563EB); border-color: var(--c, #2563EB); }
.it.checked .it-cb::after { content: '✓'; font-size: 9px; color: #fff; font-weight: 900; }
.it-txt { flex: 1; font-size: 12px; line-height: 1.45; color: var(--text); word-break: break-word; overflow-wrap: anywhere; min-width: 0; }
.it.checked .it-txt { text-decoration: line-through; color: var(--muted); }
.it.pushed .it-txt { color: var(--muted); font-style: italic; }
.it.pushed .it-txt::before { content: '↪ '; color: #F59E0B; font-style: normal; }
.it-btns { display: flex; gap: 2px; opacity: 0; transition: opacity .1s; flex-shrink: 0; }
.it:hover .it-btns { opacity: 1; }
.ibtn {
  background: transparent; border: none; cursor: pointer;
  font-size: 11px; padding: 2px 5px; border-radius: 3px;
  color: var(--muted); font-family: inherit; transition: all .1s; line-height: 1;
}
.ibtn:hover { background: var(--faint); }
.ibtn.p:hover { color: #F59E0B; }
.ibtn.d:hover { color: #EF4444; }

/* ── ADD ROW ── */
.add-row {
  border-top: 1px solid var(--border); padding: 7px 10px;
  display: flex; align-items: center; background: var(--faint);
}
.add-row input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--muted);
}
.add-row input::placeholder { color: #C5CEDF; }
.add-row input:focus { color: var(--text); }
.add-row input:focus::placeholder { color: var(--muted); }

/* ── DONE COLLAPSIBLE ── */
.done-card .card-head { cursor: pointer; user-select: none; }
.done-card .card-head:hover { background: #edf0f8; }
.chevron { color: var(--muted); font-size: 10px; transition: transform .2s; flex-shrink: 0; }
.done-card.collapsed .chevron { transform: rotate(-90deg); }
.done-card.collapsed .items { display: none; }
.done-card.collapsed .add-row { display: none; }

/* ── BRAIN DUMP VIEW ── */
.bd-header { margin-bottom: 16px; }
.bd-title { font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 800; color: var(--navy); margin-bottom: 3px; }
.bd-sub { font-size: 12px; color: var(--muted); }
.bd-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(27,52,97,0.06); }
.bd-add {
  display: flex; gap: 8px; padding: 12px 14px;
  border-bottom: 2px solid var(--border); background: #F8FAFF;
}
.bd-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
}
.bd-input::placeholder { color: #C5CEDF; }
.bd-btn {
  background: var(--navy); color: white; border: none;
  padding: 6px 16px; border-radius: 4px; font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  cursor: pointer; transition: background .15s;
}
.bd-btn:hover { background: var(--navy2); }
.bd-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 14px; border-bottom: 1px solid var(--border); transition: background .1s;
}
.bd-item:last-child { border-bottom: none; }
.bd-item:hover { background: #F7F9FD; }
.bd-item-txt { flex: 1; font-size: 12.5px; line-height: 1.45; color: var(--text); word-break: break-word; }
.bd-actions { display: flex; align-items: center; gap: 6px; opacity: 0; transition: opacity .1s; flex-shrink: 0; }
.bd-item:hover .bd-actions { opacity: 1; }
.bd-select {
  font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text);
  background: var(--faint); border: 1px solid var(--border);
  padding: 4px 6px; border-radius: 3px; outline: none; cursor: pointer;
}
.bd-send {
  background: var(--blue); color: white; border: none;
  padding: 4px 10px; border-radius: 3px; font-size: 10px;
  font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
  transition: background .12s; white-space: nowrap;
}
.bd-send:hover { background: #1d4ed8; }
.bd-del {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; font-size: 15px; padding: 0 2px;
  transition: color .1s; line-height: 1;
}
.bd-del:hover { color: #EF4444; }
.bd-empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }

/* ── EMPTY STATE ── */
.empty-week {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.empty-week h2 { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.empty-week p { font-size: 12px; line-height: 1.7; }

/* ── DUE TODAY BANNER ── */
.due-banner {
  background: #FFF1F2; border: 1px solid #FECDD3;
  border-left: 3px solid #DC2626; border-radius: 6px;
  margin-bottom: 16px; overflow: hidden;
}
.due-banner-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; user-select: none;
}
.due-banner-title {
  font-family: 'Montserrat', sans-serif; font-size: 9.5px;
  font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: #991B1B; flex: 1;
}
.due-banner-body { padding: 2px 14px 10px; }
.due-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid #FECDD3; font-size: 11.5px;
}
.due-item:last-child { border-bottom: none; }
.due-item-text { flex: 1; color: #7F1D1D; line-height: 1.4; }
.due-item-date { font-size: 9px; color: #B91C1C; font-weight: 600; flex-shrink: 0; }
.due-send-select {
  font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--text);
  background: white; border: 1px solid #FECDD3; padding: 3px 6px;
  border-radius: 3px; outline: none; cursor: pointer; flex-shrink: 0;
}
.due-send-btn {
  background: #DC2626; color: white; border: none; padding: 3px 10px;
  border-radius: 3px; font-size: 10px; font-weight: 600;
  cursor: pointer; font-family: 'Inter', sans-serif; transition: background .12s; white-space: nowrap;
}
.due-send-btn:hover { background: #B91C1C; }

/* ── SCHEDULED CARD ── */
.sched-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 10px; transition: background .1s; border-bottom: 1px solid var(--border);
}
.sched-item:last-child { border-bottom: none; }
.sched-item:hover { background: #F7F9FD; }
.sched-date-badge {
  flex-shrink: 0; font-size: 9px; font-weight: 700;
  font-family: 'Montserrat', sans-serif; letter-spacing: 0.3px;
  background: var(--faint); border: 1px solid var(--border);
  color: var(--muted); padding: 2px 6px; border-radius: 3px;
  margin-top: 1px; white-space: nowrap;
}
.sched-date-badge.overdue { background: #FEF2F2; border-color: #FECACA; color: #DC2626; }
.sched-date-badge.today   { background: #FFF1F2; border-color: #FECDD3; color: #DC2626; }
.sched-item-txt { flex: 1; font-size: 11.5px; line-height: 1.4; color: var(--text); word-break: break-word; }
.sched-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 13px; opacity: 0; transition: all .1s; padding: 0 2px; }
.sched-item:hover .sched-del { opacity: 1; }
.sched-del:hover { color: #EF4444; }
.sched-add-form { padding: 8px 10px; border-top: 1px solid var(--border); background: var(--faint); display: flex; flex-direction: column; gap: 6px; }
.sched-add-form input[type="text"] {
  width: 100%; background: white; border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 8px; font-family: 'Inter', sans-serif;
  font-size: 11.5px; color: var(--text); outline: none;
}
.sched-add-form input[type="text"]:focus { border-color: var(--blue); }
.sched-add-form input[type="text"]::placeholder { color: #C5CEDF; }
.sched-add-row { display: flex; gap: 6px; align-items: center; }
.sched-add-form input[type="date"] {
  flex: 1; background: white; border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 8px; font-family: 'Inter', sans-serif;
  font-size: 11px; color: var(--text); outline: none; cursor: pointer;
}
.sched-add-form input[type="date"]:focus { border-color: var(--blue); }
.sched-save-btn {
  background: var(--navy); color: white; border: none;
  padding: 5px 12px; border-radius: 4px; font-family: 'Montserrat', sans-serif;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
  transition: background .15s; white-space: nowrap;
}
.sched-save-btn:hover { background: var(--navy2); }

/* ── COPY TO TOMORROW ── */
.copy-tomorrow-bar {
  display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 2px;
}
.copy-tomorrow-btn {
  font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 600;
  color: var(--muted); background: transparent; border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 4px; cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 5px;
}
.copy-tomorrow-btn:hover { background: #EEF4FF; color: var(--blue); border-color: #BFDBFE; }
/* ── INNER DAY SUB-TABS ── */
.inner-tabs-wrap {
  background: white; border: 1px solid var(--border);
  border-radius: 6px 6px 0 0; border-bottom: none;
  display: flex; align-items: center; padding: 0 4px;
  box-shadow: 0 1px 4px rgba(27,52,97,0.06);
}
.inner-day-tab {
  font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 700;
  letter-spacing: 1.1px; text-transform: uppercase;
  color: var(--muted); padding: 11px 13px 9px;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; user-select: none; white-space: nowrap;
}
.inner-day-tab:hover { color: var(--navy); }
.inner-day-tab.active { color: var(--navy); border-bottom-color: var(--blue); }
.inner-day-tab.board-tab.active { color: #065F46; border-bottom-color: #059669; }
.inner-tab-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.inner-content {
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 6px 6px; padding: 16px;
  background: var(--bg);
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const DAYS      = ['monday','tuesday','wednesday','thursday','friday'];
const DAY_LABELS= ['MON','TUE','WED','THU','FRI'];

const DAY_SECS = [
  { key:'mustDo',      label:'Must Do Today',  c:'#DC2626', max:8  },
  { key:'followUps',   label:'Follow Ups',     c:'#1D4ED8'         },
  { key:'prospecting', label:'Prospecting',    c:'#B45309'         },
];

const HOT_SECS = [
  { key:'hotJobs',    label:'Hot Jobs',    c:'#DC2626' },
  { key:'hotDocs',    label:'Hot Docs',    c:'#C2410C' },
];

const WEEKLY_SECS = [
  { key:'activePlacements', label:'Active Placements',  c:'#1D4ED8' },
  { key:'filesStarts',      label:'Files & Starts',     c:'#0F766E' },
  { key:'pipeline',         label:'Pipeline',           c:'#7C3AED' },
  { key:'monthlyFu',        label:'Monthly Follow-Ups', c:'#B45309' },
  { key:'weeklyNotes',      label:'Notes',              c:'#4B5563' },
];

// ── WEEK / DAY UTILS ────────────────────────────────────────
function getMondayOf(d = new Date()) {
  const dt = new Date(d);
  const day = dt.getDay();
  dt.setDate(dt.getDate() - (day === 0 ? 6 : day - 1));
  dt.setHours(0,0,0,0);
  return dt;
}

function weekId(d = new Date()) {
  const m = getMondayOf(d);
  return `${m.getFullYear()}-${pad(m.getMonth()+1)}-${pad(m.getDate())}`;
}

function prevWeekId() {
  const m = getMondayOf();
  m.setDate(m.getDate() - 7);
  return `${m.getFullYear()}-${pad(m.getMonth()+1)}-${pad(m.getDate())}`;
}

function pad(n) { return String(n).padStart(2,'0'); }

function todayKey() {
  const d = new Date().getDay();
  return (d === 0 || d === 6) ? 'monday' : DAYS[d-1];
}

function isWeekend() { const d = new Date().getDay(); return d===0||d===6; }

function weekDates() {
  const mon = getMondayOf();
  return DAYS.map((_,i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return `${d.getMonth()+1}/${d.getDate()}`;
  });
}

const WDATES = weekDates();

function nextBizDay(dayKey) {
  const idx = DAYS.indexOf(dayKey);
  if (idx === -1 || idx === 4) return { day:'monday', newWeek:true };
  return { day:DAYS[idx+1], newWeek:false };
}

function getNextWeekId() {
  const m = getMondayOf();
  m.setDate(m.getDate() + 7);
  return `${m.getFullYear()}-${pad(m.getMonth()+1)}-${pad(m.getDate())}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// ── INITIAL STATE ───────────────────────────────────────────
function emptyDay() {
  return { mustDo:[], followUps:[], admin:[], prospecting:[], waitingOn:[], done:[] };
}
function emptyWeekly() {
  const w = {};
  WEEKLY_SECS.forEach(s => { w[s.key] = []; });
  return w;
}
function emptyWeek() {
  const w = {};
  DAYS.forEach(d => { w[d] = emptyDay(); });
  w.weekly = emptyWeekly();
  return w;
}

let state = {
  weeks: {},
  hot: { hotJobs:[], hotDocs:[], hotClients:[] },
  brainDump: [],
  scheduled: [],
  activeDay: todayKey(),
  activeView: 'daily',
  lkDay: 'monday',
  nwDay: 'monday',
  doneCollapsed: false,
  carryDismissed: [],
  nextId: 1,
};

// ── STORAGE ─────────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem('mbs-planner-v1');
    if (raw) {
      state = JSON.parse(raw);
      sanitize();
      return;
    }
  } catch(e) {}
  // Fall back to data embedded in the file itself
  try {
    if (typeof MBS_EMBEDDED !== 'undefined' && MBS_EMBEDDED) {
      state = MBS_EMBEDDED;
      sanitize();
      saveNow(); // restore to localStorage
      return;
    }
  } catch(e) {}
  // Truly fresh start
  sanitize();
}

function sanitize() {
  const wid = weekId();
  if (!state.weeks) state.weeks = {};
  if (!state.weeks[wid]) state.weeks[wid] = emptyWeek();
  DAYS.forEach(day => {
    if (!state.weeks[wid][day]) state.weeks[wid][day] = emptyDay();
    const d = state.weeks[wid][day];
    ['mustDo','followUps','admin','prospecting','waitingOn','done'].forEach(k => { if(!d[k]) d[k]=[]; });
  });
  if (!state.weeks[wid].weekly) state.weeks[wid].weekly = emptyWeekly();
  WEEKLY_SECS.forEach(s => { if(!state.weeks[wid].weekly[s.key]) state.weeks[wid].weekly[s.key]=[]; });
  if (!state.hot) state.hot = { hotJobs:[], hotDocs:[], hotClients:[] };
  HOT_SECS.forEach(s => { if(!state.hot[s.key]) state.hot[s.key]=[]; });
  if (!state.brainDump) state.brainDump = [];
  if (!state.scheduled) state.scheduled = [];
  if (!state.carryDismissed) state.carryDismissed = [];
  if (state.fridayDismissed === undefined) state.fridayDismissed = false;
  if (!state.activeDay) state.activeDay = todayKey();
  if (!state.activeView) state.activeView = 'daily';
  if (!state.lkDay) state.lkDay = 'monday';
  if (!state.nwDay) state.nwDay = 'monday';
}

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem('mbs-planner-v1', JSON.stringify(state)); } catch(e){}
  }, 350);
}
function saveNow() {
  try { localStorage.setItem('mbs-planner-v1', JSON.stringify(state)); } catch(e){}
}

// ── HELPERS ─────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function newId() { return state.nextId++; }
function curDay() { return state.weeks[weekId()][state.activeDay]; }

function carryItems() {
  const pwid = prevWeekId();
  if (!state.weeks[pwid]) return [];
  if (state.carryDismissed.includes(weekId())) return [];
  const items = [];
  const DAY_SHORT = {monday:'Mon',tuesday:'Tue',wednesday:'Wed',thursday:'Thu',friday:'Fri'};
  DAYS.forEach(day => {
    const d = state.weeks[pwid][day];
    if (!d) return;
    DAY_SECS.forEach(sec => {
      (d[sec.key]||[]).filter(i=>!i.checked).forEach(it => {
        items.push({...it, fromDay:day, fromSec:sec.key, secLabel:sec.label, dayShort:DAY_SHORT[day]});
      });
    });
    (d.waitingOn||[]).filter(i=>!i.checked).forEach(it => {
      items.push({...it, fromDay:day, fromSec:'waitingOn', secLabel:'Waiting On', dayShort:DAY_SHORT[day]});
    });
  });
  return items;
}

// ── RENDER PIECES ────────────────────────────────────────────
function renderItems(items, secKey, color, noPush=false) {
  return (items||[]).map(it => `
    <li class="it${it.checked?' checked':''}${it.pushed?' pushed':''}"
        data-id="${it.id}" data-sec="${esc(secKey)}" style="--c:${color}">
      <div class="it-cb" data-action="check"></div>
      <span class="it-txt">${esc(it.text)}</span>
      <div class="it-btns">
        ${!noPush?`<button class="ibtn p" data-action="push" title="Defer">↪</button>`:''}
        <button class="ibtn d" data-action="del" title="Delete">×</button>
      </div>
    </li>`).join('');
}

function renderDayCard(sec) {
  const items   = curDay()[sec.key] || [];
  const active  = items.filter(i=>!i.checked).length;
  const isMaxed = sec.max && active >= sec.max;
  return `
    <div class="card" style="--c:${sec.c}">
      <div class="card-head">
        <span class="lbl">${sec.label}</span>
        ${sec.max
          ? `<span class="${isMaxed?'max-badge':'cnt-badge'}">${active}/${sec.max}</span>`
          : `<span class="cnt-badge">${active}</span>`}
      </div>
      <ul class="items">${renderItems(items, sec.key, sec.c)}</ul>
      ${isMaxed
        ? `<div class="max-hit">8-task limit reached — complete one to add more</div>`
        : `<div class="add-row"><input type="text" placeholder="+ add item…" data-sec="${sec.key}" data-action="addDay" autocomplete="off"></div>`}
    </div>`;
}

function renderHotCard(sec) {
  const items = state.hot[sec.key] || [];
  const active = items.filter(i=>!i.checked).length;
  return `
    <div class="card" style="--c:${sec.c}">
      <div class="card-head">
        <span class="lbl">${sec.label}</span>
        <span class="cnt-badge">${active}</span>
      </div>
      <ul class="items">${renderItems(items,'hot:'+sec.key,sec.c)}</ul>
      <div class="add-row"><input type="text" placeholder="+ add…" data-sec="hot:${sec.key}" data-action="addHot" autocomplete="off"></div>
    </div>`;
}

function renderWaitingOn() {
  const items = curDay().waitingOn || [];
  const active = items.filter(i=>!i.checked).length;
  return `
    <div class="card" style="--c:#4B5563">
      <div class="card-head">
        <span class="lbl">⏳ Waiting On</span>
        <span class="cnt-badge">${active}</span>
      </div>
      <ul class="items">${renderItems(items,'waitingOn','#4B5563')}</ul>
      <div class="add-row">
        <input type="text" placeholder="+ add something pending others (approvals, replies, references, interview setup…)"
          data-sec="waitingOn" data-action="addDay" autocomplete="off">
      </div>
    </div>`;
}

function renderDone() {
  const items = curDay().done || [];
  const c = state.doneCollapsed;
  return `
    <div class="card done-card${c?' collapsed':''}" style="--c:#059669">
      <div class="card-head" data-action="toggleDone" style="cursor:pointer">
        <span class="lbl">✅ Done Today</span>
        <span class="cnt-badge">${items.length}</span>
        <span class="chevron">▾</span>
      </div>
      <ul class="items">${renderItems(items,'done','#059669',true)}</ul>
      <div class="add-row"><input type="text" placeholder="+ log something you completed…" data-sec="done" data-action="addDay" autocomplete="off"></div>
    </div>`;
}

function renderCarryOver() {
  const items = carryItems();
  if (!items.length) return '';
  return `
    <div class="co-banner">
      <div class="co-head" data-action="toggleCO">
        <span class="co-title">⚠ ${items.length} unfinished item${items.length>1?'s':''} from last week — click to review</span>
        <button class="co-dismiss" data-action="dismissCO">×</button>
      </div>
      <div class="co-body" id="co-body" style="display:none">
        ${items.map(it=>`
          <div class="co-item">
            <span class="co-meta">${it.dayShort} · ${esc(it.secLabel)}</span>
            <span class="co-text">${esc(it.text)}</span>
            <button class="co-add" data-action="carryItem" data-text="${esc(it.text)}" data-sec="${it.fromSec}">+ Add to Today</button>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderWeeklyCard(sec, items, prefix, readOnly) {
  const active = (items||[]).filter(i=>!i.checked).length;
  return `
    <div class="card" style="--c:${sec.c}">
      <div class="card-head">
        <span class="lbl">${sec.label}</span>
        <span class="cnt-badge">${active}</span>
      </div>
      <ul class="items">${renderItems(items||[], prefix+sec.key, sec.c, readOnly)}</ul>
      ${readOnly ? '' : `<div class="add-row"><input type="text" placeholder="+ add…" data-sec="${prefix}${sec.key}" data-action="addWkl" autocomplete="off"></div>`}
    </div>`;
}

function renderAltDayCard(sec, items, wid, dayKey) {
  const sk     = `altd|${wid}|${dayKey}|${sec.key}`;
  const active = (items||[]).filter(i=>!i.checked).length;
  const isMaxed = sec.max && active >= sec.max;
  return `
    <div class="card" style="--c:${sec.c}">
      <div class="card-head">
        <span class="lbl">${sec.label}</span>
        ${sec.max ? `<span class="${isMaxed?'max-badge':'cnt-badge'}">${active}/${sec.max}</span>` : `<span class="cnt-badge">${active}</span>`}
      </div>
      <ul class="items">${renderItems(items||[], sk, sec.c)}</ul>
      ${isMaxed
        ? `<div class="max-hit">8-task limit reached</div>`
        : `<div class="add-row"><input type="text" placeholder="+ add item…" data-sec="${sk}" data-action="addAltDay" autocomplete="off"></div>`}
    </div>`;
}

function renderAltDayView(wid, dayKey) {
  if (!state.weeks[wid]) state.weeks[wid] = emptyWeek();
  const d = state.weeks[wid][dayKey] || emptyDay();
  const wo = d.waitingOn||[];
  const dn = d.done||[];
  const woSk = `altd|${wid}|${dayKey}|waitingOn`;
  const dnSk = `altd|${wid}|${dayKey}|done`;
  const woActive = wo.filter(i=>!i.checked).length;
  return `
    <div class="daily-grid">
      <div class="daily-left">
        ${DAY_SECS.map(s => renderAltDayCard(s, d[s.key], wid, dayKey)).join('')}
      </div>
      <div class="daily-right">
        ${HOT_SECS.map(s=>renderHotCard(s)).join('')}
      </div>
    </div>
    <div class="full-row">
      <div class="card" style="--c:#4B5563">
        <div class="card-head">
          <span class="lbl">⏳ Waiting On</span>
          <span class="cnt-badge">${woActive}</span>
        </div>
        <ul class="items">${renderItems(wo, woSk, '#4B5563')}</ul>
        <div class="add-row"><input type="text" placeholder="+ add…" data-sec="${woSk}" data-action="addAltDay" autocomplete="off"></div>
      </div>
    </div>
    <div class="full-row">
      <div class="card" style="--c:#059669">
        <div class="card-head"><span class="lbl">✅ Done</span><span class="cnt-badge">${dn.length}</span></div>
        <ul class="items">${renderItems(dn, dnSk, '#059669', true)}</ul>
        <div class="add-row"><input type="text" placeholder="+ log something completed…" data-sec="${dnSk}" data-action="addAltDay" autocomplete="off"></div>
      </div>
    </div>`;
}

function renderWeeklyBoard(wid, readOnly, isNextWeek = false) {
  const data   = state.weeks[wid] ? (state.weeks[wid].weekly || {}) : {};
  const prefix = readOnly ? 'lwkl:' : 'wkl:';
  const mon    = new Date(wid);
  const fri    = new Date(wid); fri.setDate(fri.getDate() + 4);
  const fmtDate = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const range  = `${fmtDate(mon)} – ${fmtDate(fri)}`;

  // Split sections: 4 in 2x2 grid + notes full width
  const gridSecs  = WEEKLY_SECS.slice(0,4);
  const noteSec   = WEEKLY_SECS[4];

  let carryBanner = '';
  if (readOnly) {
    const incomplete = WEEKLY_SECS.flatMap(s => (data[s.key]||[]).filter(i=>!i.checked));
    if (incomplete.length) {
      carryBanner = `
        <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:12px">
          <button class="carry-all-btn" data-action="carryAllWeekly" data-from-wid="${wid}">
            ↑ Carry ${incomplete.length} incomplete item${incomplete.length>1?'s':''} to This Week
          </button>
        </div>`;
    }
  }

  const boardHtml = `
    ${carryBanner}
    <div class="weekly-grid-2">
      ${gridSecs.map(s => renderWeeklyCard(s, data[s.key], prefix, readOnly)).join('')}
    </div>
    <div class="full-row">
      ${renderWeeklyCard(noteSec, data[noteSec.key], prefix, readOnly)}
    </div>`;

  const activeSubDay = isNextWeek ? state.nwDay : readOnly ? state.lkDay : 'board';
  const switchAction = isNextWeek ? 'switchNWDay' : 'switchLKDay';
  const viewDates    = (() => {
    const mon = new Date(wid);
    return DAYS.map((_,i) => {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      return `${d.getMonth()+1}/${d.getDate()}`;
    });
  })();

  const innerTabs = `
    <div class="inner-tabs-wrap">
      ${DAYS.map((day,i) => {
        const d = state.weeks[wid] ? state.weeks[wid][day] : null;
        const hasData = d && DAY_SECS.some(s=>(d[s.key]||[]).length>0);
        return `<div class="inner-day-tab${activeSubDay===day?' active':''}" data-action="${switchAction}" data-day="${day}">
          ${DAY_LABELS[i]} <span style="font-size:9px;color:var(--muted);margin-left:3px;font-weight:600">${viewDates[i]}</span>
          ${hasData ? `<span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:#CBD5E1;margin-left:4px;vertical-align:middle;margin-top:-2px"></span>` : ''}
        </div>`;
      }).join('')}
      <div class="inner-tab-sep"></div>
      <div class="inner-day-tab board-tab${activeSubDay==='board'?' active':''}" data-action="${switchAction}" data-day="board">
        Weekly Board
      </div>
    </div>
    <div class="inner-content">
      ${activeSubDay === 'board' ? boardHtml : renderAltDayView(wid, activeSubDay)}
    </div>`;

  return `
    <div class="weekly-header">
      <div>
        <div class="weekly-title">${readOnly ? 'Last Week' : isNextWeek ? 'Next Week' : 'This Week'}<span class="lw-badge">${range}</span></div>
        <div class="weekly-sub">${readOnly
          ? 'Review previous week by day, or see the weekly board'
          : 'Plan next week by day, or track ongoing items on the weekly board'}</div>
      </div>
    </div>
    ${innerTabs}`;
}

function autoInjectScheduled() {
  let changed = false;
  (state.scheduled||[]).forEach(it => {
    if (!it.sent) {
      const [y,m,d] = it.date.split('-').map(Number);
      const date = new Date(y, m-1, d);
      const dow  = date.getDay();

      // If weekend, push to that Monday
      if (dow === 0) date.setDate(date.getDate() + 1);
      if (dow === 6) date.setDate(date.getDate() + 2);

      const finalDow = date.getDay(); // 1=Mon … 5=Fri
      const dayKey   = DAYS[finalDow - 1];
      const targetWid = weekId(date);

      if (!state.weeks[targetWid]) state.weeks[targetWid] = emptyWeek();
      const dayData = state.weeks[targetWid][dayKey];
      const sec     = it.section || 'followUps';
      if (!dayData[sec]) dayData[sec] = [];
      dayData[sec].push({ id:newId(), text:it.text, checked:false, pushed:false });
      it.sent = true;
      changed = true;
    }
  });
  if (changed) saveNow();
}

function renderScheduled() {
  const ts      = todayStr();
  // Future items only (not yet injected)
  const future  = (state.scheduled||[])
    .filter(i => i.date > ts && !i.sent)
    .sort((a,b) => a.date.localeCompare(b.date));

  // Show next 5 days only in the card
  const cutoff  = new Date();
  cutoff.setDate(cutoff.getDate() + 5);
  const cutStr  = `${cutoff.getFullYear()}-${pad(cutoff.getMonth()+1)}-${pad(cutoff.getDate())}`;
  const visible = future.filter(i => i.date <= cutStr);
  const hidden  = future.length - visible.length;

  const fmtDate = d => {
    const [y,m,day] = d.split('-');
    return new Date(y,m-1,day).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  };

  const secOpts = [
    ...DAY_SECS.map(s=>`<option value="${s.key}">${s.label}</option>`),
    `<option value="waitingOn">Waiting On</option>`,
  ].join('');

  return `
    <div class="card" style="--c:#6366F1">
      <div class="card-head">
        <span class="lbl">📅 Scheduled</span>
        <span class="cnt-badge">${future.length}</span>
      </div>
      <ul class="items" style="max-height:180px">
        ${!visible.length && !hidden
          ? `<li style="padding:16px 10px;font-size:11px;color:var(--muted);text-align:center;list-style:none">No upcoming tasks — add one below</li>`
          : visible.map(it => `
            <li class="sched-item" data-sched-id="${it.id}">
              <span class="sched-date-badge">${fmtDate(it.date)}</span>
              <span class="sched-item-txt">${esc(it.text)}</span>
              <button class="sched-del" data-action="delSched" data-id="${it.id}">×</button>
            </li>`).join('')
        }
        ${hidden ? `<li style="padding:6px 10px;font-size:10.5px;color:var(--muted);font-style:italic;list-style:none">+ ${hidden} more scheduled further out</li>` : ''}
      </ul>
      <div class="sched-add-form">
        <input type="text" id="sched-text-input" placeholder="e.g. Follow up with Justin – Tallahassee" autocomplete="off">
        <div class="sched-add-row">
          <input type="date" id="sched-date-input" min="${ts}">
          <select id="sched-sec-input" style="font-family:Inter,sans-serif;font-size:10.5px;color:var(--text);background:white;border:1px solid var(--border);padding:5px 6px;border-radius:4px;outline:none;cursor:pointer;">${secOpts}</select>
        </div>
        <button class="sched-save-btn" data-action="addSched">Schedule →</button>
      </div>
    </div>`;
}

function renderDueBanner() {
  // Only shows overdue items (past due date, app wasn't opened that day)
  const ts   = todayStr();
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = `${yesterday.getFullYear()}-${pad(yesterday.getMonth()+1)}-${pad(yesterday.getDate())}`;
  const overdue = (state.scheduled||[]).filter(i => i.date < ts && i.date <= yStr && !i.sent);
  if (!overdue.length) return '';
  const fmtDate = d => {
    const [y,m,day] = d.split('-');
    return new Date(y,m-1,day).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  };
  return `
    <div class="due-banner">
      <div class="due-banner-head" data-action="toggleDueBanner">
        <span class="due-banner-title">⚠ ${overdue.length} overdue scheduled task${overdue.length>1?'s':''} — missed while app was closed</span>
      </div>
      <div class="due-banner-body" id="due-banner-body" style="display:none">
        ${overdue.map(it=>`
          <div class="due-item">
            <span class="due-item-date">${fmtDate(it.date)}</span>
            <span class="due-item-text">${esc(it.text)}</span>
            <button class="due-send-btn" data-action="sendDue" data-id="${it.id}">+ Add to Today</button>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderBrainDump() {
  const items = state.brainDump || [];
  const opts = [
    ...DAY_SECS.map(s=>`<option value="${s.key}">${s.label}</option>`),
    `<option value="waitingOn">Waiting On</option>`,
    `<option disabled>──────────</option>`,
    ...WEEKLY_SECS.map(s=>`<option value="wkl:${s.key}">This Week · ${s.label}</option>`),
    `<option disabled>──────────</option>`,
    ...HOT_SECS.map(s=>`<option value="hot:${s.key}">${s.label}</option>`),
  ].join('');
  return `
    <div class="bd-header">
      <div class="bd-title">🧠 Brain Dump</div>
      <div class="bd-sub">Capture everything here — sort it into today's buckets when you're ready</div>
    </div>
    <div class="bd-card">
      <div class="bd-add">
        <input class="bd-input" type="text" placeholder="Type anything — tasks, follow-ups, ideas, reminders…" data-action="addBD" autocomplete="off">
        <button class="bd-btn" data-action="addBDBtn">+ Add</button>
      </div>
      ${!items.length
        ? `<div class="bd-empty">Nothing here yet.<br>Type above and hit <strong>Enter</strong> to start your morning dump.</div>`
        : items.map(it=>`
          <div class="bd-item" data-bd-id="${it.id}">
            <span class="bd-item-txt">${esc(it.text)}</span>
            <div class="bd-actions">
              <select class="bd-select">${opts}</select>
              <button class="bd-send" data-action="sendBD" data-id="${it.id}">→ Send to Today</button>
              <button class="bd-del" data-action="delBD" data-id="${it.id}">×</button>
            </div>
          </div>`).join('')
      }
    </div>`;
}

// ── MAIN RENDER ──────────────────────────────────────────────
function render() {
  const today      = new Date();
  const tKey       = todayKey();
  const weekend    = isWeekend();
  const dayName    = today.toLocaleDateString('en-US',{weekday:'long'});
  const dateStr    = today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const wid        = weekId();

  // Day tabs — with dots for days that have content
  const tabs = DAYS.map((day,i)=>{
    const isToday  = day===tKey && !weekend;
    const isActive = day===state.activeDay && state.activeView==='daily';
    const dayData  = state.weeks[wid] ? state.weeks[wid][day] : null;
    const hasData  = dayData && DAY_SECS.some(s=>(dayData[s.key]||[]).length > 0);
    return `
      <div class="day-tab${isActive?' active':''}" data-action="switchDay" data-day="${day}">
        ${DAY_LABELS[i]}<span style="font-size:9px;color:var(--muted);margin-left:4px;font-weight:600">${WDATES[i]}</span>
        ${isToday?`<span class="today-dot"></span>`:hasData?`<span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:#CBD5E1;margin-left:5px;vertical-align:middle;margin-top:-2px"></span>`:''}
      </div>`;
  }).join('');

  // Content
  let body = '';
  if (state.activeView === 'brainDump') {
    body = renderBrainDump();
  } else if (state.activeView === 'thisWeek') {
    body = renderWeeklyBoard(wid, false);
  } else if (state.activeView === 'nextWeek') {
    const nwid = getNextWeekId();
    if (!state.weeks[nwid]) state.weeks[nwid] = emptyWeek();
    body = renderWeeklyBoard(nwid, false, true);
  } else if (state.activeView === 'lastWeek') {
    const pwid = prevWeekId();
    if (!state.weeks[pwid]) {
      body = `<div style="text-align:center;padding:60px 20px;color:var(--muted)"><p style="font-family:Montserrat;font-size:14px;font-weight:700;color:var(--navy);margin-bottom:8px">No data for last week</p><p style="font-size:12px">Last week's board will appear here once you've used the planner for a full week.</p></div>`;
    } else {
      body = renderWeeklyBoard(pwid, true);
    }
  } else {
    const isFriday = new Date().getDay() === 5;
    const fridayBanner = (isFriday && !state.fridayDismissed) ? `
      <div class="friday-banner">
        <span class="friday-banner-text">🎉 <strong>It's Friday!</strong> Save your updated planner file so your work is safe over the weekend.</span>
        <button class="friday-save-btn" data-action="saveFile">💾 Save File Now</button>
        <button class="friday-dismiss" data-action="dismissFriday">×</button>
      </div>` : '';
    const nextDay = nextBizDay(state.activeDay);
    const nextLabel = nextDay.newWeek ? 'Monday' : nextDay.day.charAt(0).toUpperCase()+nextDay.day.slice(1);
    body = `
      ${fridayBanner}
      ${renderDueBanner()}
      ${renderCarryOver()}
      <div class="copy-tomorrow-bar">
        <button class="copy-tomorrow-btn" data-action="copyToTomorrow" title="Copy all incomplete items to ${nextLabel}">
          Copy incomplete → ${nextLabel}
        </button>
      </div>
      <div class="daily-grid">
        <div class="daily-left">
          ${DAY_SECS.map(s=>renderDayCard(s)).join('')}
        </div>
        <div class="daily-right">
          ${HOT_SECS.map(s=>renderHotCard(s)).join('')}
          ${renderScheduled()}
        </div>
      </div>
      <div class="full-row">${renderWaitingOn()}</div>
      <div class="full-row">${renderDone()}</div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="mbs-logo">MBS<span>.</span></div>
        <div class="top-divider"></div>
        <div class="top-subtitle">Daily Planner</div>
      </div>
      <div class="top-bar-right">
        <div class="top-date"><strong>${dayName}</strong>${dateStr}</div>
        <button class="nav-btn import" data-action="importData">↑ Import</button>
        <button class="nav-btn save-file" data-action="saveFile">💾 Save File</button>
        <button class="new-week-btn" data-action="newWeek">↺ New Week</button>
      </div>
    </div>
    <div class="day-tabs">
      ${tabs}
      <div class="tab-sep"></div>
      <div class="week-tab${state.activeView==='thisWeek'?' active-tw':''}" data-action="switchView" data-view="thisWeek">This Week</div>
      <div class="week-tab${state.activeView==='nextWeek'?' active-nw':''}" data-action="switchView" data-view="nextWeek">Next Week</div>
      <div class="week-tab${state.activeView==='lastWeek'?' active-lw':''}" data-action="switchView" data-view="lastWeek">Last Week</div>
      <div class="tab-sep"></div>
      <div class="brain-tab${state.activeView==='brainDump'?' active':''}" data-action="switchBD">🧠 Brain Dump</div>
    </div>
    <div class="content">${body}</div>
  `;
}

// ── EVENTS ───────────────────────────────────────────────────
document.addEventListener('click', e => {
  const el  = e.target;
  const aEl = el.closest('[data-action]');
  if (!aEl) return;
  const action = aEl.dataset.action;
  const wid    = weekId();

  if (action === 'saveFile') {
    try {
      const appEl = document.getElementById('app');
      const saved = appEl.innerHTML;
      appEl.innerHTML = '';
      const safeData = JSON.stringify(state).replace(/<\//g, '<\\/');
      let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      appEl.innerHTML = saved;
      html = html.replace(
        /var MBS_EMBEDDED=.*?;\/\*MBS_DATA_END\*\//s,
        `var MBS_EMBEDDED=${safeData};/*MBS_DATA_END*/`
      );
      const blob = new Blob([html], { type: 'text/html' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `mbs-planner-${todayStr()}.html`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(err) {
      alert('Save failed: ' + err.message);
    }
    return;
  }

  if (action === 'dismissFriday') {
    state.fridayDismissed = true;
    save(); render(); return;
  }

  if (action === 'importData') {
    let inp = document.getElementById('_import_input');
    if (!inp) {
      inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json'; inp.id = '_import_input';
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.addEventListener('change', () => {
        const file = inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const parsed = JSON.parse(e.target.result);
            state = parsed;
            sanitize();
            saveNow();
            render();
            alert('Data imported successfully!');
          } catch(err) {
            alert('Import failed — make sure you\'re using a valid MBS Planner backup file.');
          }
          inp.value = '';
        };
        reader.readAsText(file);
      });
    }
    inp.click();
    return;
  }

  if (action === 'switchDay') {
    state.activeDay  = aEl.dataset.day;
    state.activeView = 'daily';
    save(); render(); return;
  }

  if (action === 'switchLKDay') {
    state.lkDay = aEl.dataset.day;
    save(); render(); return;
  }

  if (action === 'switchNWDay') {
    state.nwDay = aEl.dataset.day;
    save(); render(); return;
  }

  if (action === 'switchView') {
    state.activeView = aEl.dataset.view;
    save(); render(); return;
  }

  if (action === 'newWeek') {
    if (confirm('Start a fresh week? Your data from this and all past weeks stays saved.')) {
      state.weeks[wid] = emptyWeek();
      state.activeDay  = todayKey();
      state.activeView = 'daily';
      state.doneCollapsed = false;
      saveNow(); render();
    }
    return;
  }

  if (action === 'toggleDone') {
    state.doneCollapsed = !state.doneCollapsed;
    save(); render(); return;
  }

  if (action === 'toggleCO') {
    e.stopPropagation();
    const b = document.getElementById('co-body');
    if (b) b.style.display = b.style.display==='none' ? '' : 'none';
    return;
  }

  if (action === 'dismissCO') {
    e.stopPropagation();
    if (!state.carryDismissed.includes(wid)) state.carryDismissed.push(wid);
    save(); render(); return;
  }

  if (action === 'carryItem') {
    const { text, sec } = aEl.dataset;
    const item = { id:newId(), text, checked:false, pushed:false };
    const day = state.weeks[wid][state.activeDay];
    if (sec.startsWith('hot:')) {
      const k = sec.slice(4);
      (state.hot[k]||(state.hot[k]=[])).push(item);
    } else {
      (day[sec]||(day[sec]=[])).push(item);
    }
    aEl.textContent = '✓ Added';
    aEl.disabled = true;
    aEl.style.opacity = '0.5';
    save(); return;
  }

  if (action === 'carryAllWeekly') {
    const fromWid = aEl.dataset.fromWid;
    const srcWeek = state.weeks[fromWid];
    if (!srcWeek || !srcWeek.weekly) return;
    const thisWid = weekId();
    if (!state.weeks[thisWid].weekly) state.weeks[thisWid].weekly = emptyWeekly();
    WEEKLY_SECS.forEach(s => {
      const incomplete = (srcWeek.weekly[s.key]||[]).filter(i=>!i.checked);
      incomplete.forEach(it => {
        state.weeks[thisWid].weekly[s.key].push({ id:newId(), text:it.text, checked:false, pushed:false });
      });
    });
    state.activeView = 'thisWeek';
    saveNow(); render(); return;
  }

  if (action === 'check' || action === 'push' || action === 'del') {
    const li = el.closest('.it');
    if (!li) return;
    const sec   = li.dataset.sec;
    const numId = parseInt(li.dataset.id);
    const day   = state.weeks[wid][state.activeDay];

    let arr;
    if (sec.startsWith('hot:'))   arr = state.hot[sec.slice(4)];
    else if (sec.startsWith('wkl:'))  arr = state.weeks[wid].weekly[sec.slice(4)];
    else if (sec.startsWith('lwkl:')) arr = (state.weeks[prevWeekId()]||{weekly:{}}).weekly[sec.slice(5)];
    else if (sec.startsWith('altd|')) {
      const [,altWid,altDay,altSec] = sec.split('|');
      if (!state.weeks[altWid]) state.weeks[altWid] = emptyWeek();
      arr = state.weeks[altWid][altDay][altSec];
    }
    else arr = day[sec];
    if (!arr) return;

    const item = arr.find(i=>i.id===numId);
    if (!item) return;

    if (action==='check') {
      const isDailySection = !sec.startsWith('hot:') && !sec.startsWith('wkl:') && !sec.startsWith('lwkl:') && sec !== 'done';
      if (isDailySection) {
        arr.splice(arr.indexOf(item), 1);
        if (!day.done) day.done = [];
        day.done.unshift({ id:newId(), text:item.text, checked:true, pushed:false });
        state.doneCollapsed = false;
      } else {
        item.checked = !item.checked;
      }
    }
    if (action==='push') {
      const isDailySection = !sec.startsWith('hot:') && !sec.startsWith('wkl:') && !sec.startsWith('lwkl:') && sec !== 'done';
      if (isDailySection) {
        const { day:nextDay, newWeek } = nextBizDay(state.activeDay);
        const targetWid = newWeek ? getNextWeekId() : wid;
        if (!state.weeks[targetWid]) state.weeks[targetWid] = emptyWeek();
        const targetDayData = state.weeks[targetWid][nextDay];
        if (!targetDayData[sec]) targetDayData[sec] = [];
        targetDayData[sec].push({ id:newId(), text:item.text, checked:false, pushed:false });
        arr.splice(arr.indexOf(item), 1);
      } else {
        item.pushed = !item.pushed;
      }
    }
    if (action==='del') arr.splice(arr.indexOf(item),1);
    save(); render(); return;
  }

  if (action === 'copyToTomorrow') {
    const { day:nextDay, newWeek } = nextBizDay(state.activeDay);
    const targetWid = newWeek ? getNextWeekId() : wid;
    if (!state.weeks[targetWid]) state.weeks[targetWid] = emptyWeek();
    const src = state.weeks[wid][state.activeDay];
    const tgt = state.weeks[targetWid][nextDay];
    let count = 0;
    const secsToCopy = [...DAY_SECS.map(s=>s.key), 'waitingOn'];
    secsToCopy.forEach(k => {
      const incomplete = (src[k]||[]).filter(i=>!i.checked);
      incomplete.forEach(it => {
        (tgt[k]||(tgt[k]=[])).push({ id:newId(), text:it.text, checked:false, pushed:false });
        count++;
      });
    });
    const nextLabel = newWeek ? 'Monday' : nextDay.charAt(0).toUpperCase()+nextDay.slice(1);
    saveNow();
    alert(`${count} incomplete item${count!==1?'s':''} copied to ${nextLabel}.`);
    return;
  }

  if (action === 'toggleDueBanner') {
    const b = document.getElementById('due-banner-body');
    if (b) b.style.display = b.style.display === 'none' ? '' : 'none';
    return;
  }

  if (action === 'sendDue') {
    const id    = parseInt(aEl.dataset.id);
    const schIt = (state.scheduled||[]).find(i=>i.id===id);
    if (!schIt) return;
    const day   = state.weeks[wid][state.activeDay];
    const sec   = schIt.section || 'followUps';
    (day[sec]||(day[sec]=[])).push({ id:newId(), text:schIt.text, checked:false, pushed:false });
    schIt.sent = true;
    save(); render(); return;
  }

  if (action === 'addSched') {
    const textInp = document.getElementById('sched-text-input');
    const dateInp = document.getElementById('sched-date-input');
    const secInp  = document.getElementById('sched-sec-input');
    if (!textInp||!dateInp) return;
    const text    = textInp.value.trim();
    const date    = dateInp.value;
    const section = secInp ? secInp.value : 'followUps';
    if (!text || !date) { alert('Please enter both a description and a date.'); return; }
    if (!state.scheduled) state.scheduled = [];
    state.scheduled.push({ id:newId(), text, date, section, sent:false });
    autoInjectScheduled();
    save(); render(); return;
  }

  if (action === 'delSched') {
    const id = parseInt(aEl.dataset.id);
    state.scheduled = (state.scheduled||[]).filter(i=>i.id!==id);
    save(); render(); return;
  }

  if (action === 'addBDBtn') {
    const inp = document.querySelector('[data-action="addBD"]');
    if (!inp) return;
    const text = inp.value.trim();
    if (!text) return;
    state.brainDump.push({ id:newId(), text });
    save(); render(); return;
  }

  if (action === 'sendBD') {
    const id  = parseInt(aEl.dataset.id);
    const sel = document.querySelector(`.bd-item[data-bd-id="${id}"] .bd-select`);
    const sec = sel ? sel.value : 'mustDo';
    const bdIt = state.brainDump.find(i=>i.id===id);
    if (!bdIt) return;
    const newItem = { id:newId(), text:bdIt.text, checked:false, pushed:false };
    const day = state.weeks[wid][state.activeDay];
    if (sec.startsWith('hot:')) {
      const k = sec.slice(4);
      (state.hot[k]||(state.hot[k]=[])).push(newItem);
    } else if (sec.startsWith('wkl:')) {
      const k = sec.slice(4);
      if (!state.weeks[wid].weekly) state.weeks[wid].weekly = emptyWeekly();
      (state.weeks[wid].weekly[k]||(state.weeks[wid].weekly[k]=[])).push(newItem);
    } else {
      (day[sec]||(day[sec]=[])).push(newItem);
    }
    state.brainDump = state.brainDump.filter(i=>i.id!==id);
    save(); render(); return;
  }

  if (action === 'delBD') {
    const id = parseInt(aEl.dataset.id);
    state.brainDump = state.brainDump.filter(i=>i.id!==id);
    save(); render(); return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const inp = e.target;
  if (inp.tagName !== 'INPUT') return;
  const { action, sec } = inp.dataset;
  const text = inp.value.trim();
  if (!text) return;
  const wid = weekId();
  const day = state.weeks[wid][state.activeDay];

  if (action === 'addAltDay') {
    const [,altWid,altDay,altSec] = sec.split('|');
    if (!state.weeks[altWid]) state.weeks[altWid] = emptyWeek();
    const altDayData = state.weeks[altWid][altDay];
    if (!altDayData[altSec]) altDayData[altSec] = [];
    if (altSec === 'mustDo' && altDayData.mustDo.filter(i=>!i.checked).length >= 8) return;
    altDayData[altSec].push({ id:newId(), text, checked:false, pushed:false });
    save(); render();
  }

  if (action === 'addDay') {
    if (sec === 'mustDo') {
      const active = (day.mustDo||[]).filter(i=>!i.checked).length;
      if (active >= 8) return;
    }
    (day[sec]||(day[sec]=[])).push({ id:newId(), text, checked:false, pushed:false });
    save(); render();
  }

  if (action === 'addHot') {
    const k = sec.slice(4);
    (state.hot[k]||(state.hot[k]=[])).push({ id:newId(), text, checked:false, pushed:false });
    save(); render();
  }

  if (action === 'addWkl') {
    const wid = weekId();
    const k = sec.startsWith('wkl:') ? sec.slice(4) : sec;
    if (!state.weeks[wid].weekly) state.weeks[wid].weekly = emptyWeekly();
    (state.weeks[wid].weekly[k]||(state.weeks[wid].weekly[k]=[])).push({ id:newId(), text, checked:false, pushed:false });
    save(); render();
  }

  if (action === 'addBD') {
    state.brainDump.push({ id:newId(), text });
    save(); render();
  }
});

// ── INIT ────────────────────────────────────────────────────
loadState();
autoInjectScheduled();
render();
</script>
<script id="mbs-data">var MBS_EMBEDDED=null;/*MBS_DATA_END*/</script>
</body>
</html>
